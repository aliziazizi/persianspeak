<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات PersianSpeak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff;
            padding: 20px;
        }

        .services-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 60px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .service-card {
            position: relative;
            background: linear-gradient(135deg, rgba(30, 70, 90, 0.2) 0%, rgba(20, 50, 70, 0.2) 100%);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(0);
        }

        /* Background glow effect */
        .service-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.3) 0%, rgba(100, 200, 255, 0) 70%);
            transform: translate(-50%, -50%);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        /* Border glow effect */
        .service-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            border: 2px solid transparent;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0), rgba(100, 200, 255, 0.3), rgba(100, 200, 255, 0)) no-repeat;
            background-size: 200% 200%;
            background-position: 0% 0%;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .service-card:hover {
            transform: translateY(-15px);
            border-color: rgba(100, 200, 255, 0.4);
            box-shadow: 0 20px 40px rgba(100, 200, 255, 0.1);
        }

        /* Glow on hover - background */
        .service-card:hover::before {
            width: 300px;
            height: 300px;
            opacity: 0.8;
        }

        /* Glow on hover - border */
        .service-card:hover::after {
            opacity: 1;
            animation: borderGlow 2s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0% {
                background-position: 0% 0%;
                box-shadow: 0 0 20px rgba(100, 200, 255, 0.4), inset 0 0 20px rgba(100, 200, 255, 0.1);
            }
            50% {
                background-position: 100% 100%;
                box-shadow: 0 0 30px rgba(100, 200, 255, 0.6), inset 0 0 30px rgba(100, 200, 255, 0.2);
            }
            100% {
                background-position: 0% 0%;
                box-shadow: 0 0 20px rgba(100, 200, 255, 0.4), inset 0 0 20px rgba(100, 200, 255, 0.1);
            }
        }

        .service-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.2) 0%, rgba(100, 200, 255, 0.1) 100%);
            border: 2px solid rgba(100, 200, 255, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            transition: all 0.4s ease;
        }

        .service-icon svg {
            width: 100%;
            height: 100%;
            max-width: 50px;
            max-height: 50px;
        }

        .section-icon, .section-icon2 {
            fill: #64c8ff;
            transition: all 0.4s ease;
        }

        .service-card:hover .service-icon {
            transform: scale(1.1);
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.4) 0%, rgba(100, 200, 255, 0.2) 100%);
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }

        .service-card:hover .section-icon, .service-card:hover .section-icon2 {
            fill: #ffffff;
        }

        .service-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .service-card:hover .service-title {
            color: #64c8ff;
        }

        .service-description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }

        .service-card:hover .service-description {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .section-title {
                font-size: 1.8rem;
                margin-bottom: 40px;
            }

            .services-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .service-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
