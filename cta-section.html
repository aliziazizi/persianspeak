<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff;
            padding: 20px;
        }

        .cta-section {
            max-width: 1000px;
            margin: 60px auto;
            padding: 60px 40px;
            background: linear-gradient(135deg, rgba(20, 80, 110, 0.3) 0%, rgba(10, 50, 80, 0.3) 100%);
            border: 2px solid rgba(100, 200, 255, 0.2);
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .cta-section::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, 30px);
            }
        }

        .cta-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .cta-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #64c8ff 0%, #a0e4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cta-description {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-button {
            position: relative;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid rgba(100, 200, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #64c8ff;
            background: rgba(100, 200, 255, 0.05);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            border: 2px solid transparent;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0), rgba(100, 200, 255, 0.3), rgba(100, 200, 255, 0)) no-repeat;
            background-size: 200% 200%;
            background-position: 0% 0%;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .cta-button:hover {
            border-color: rgba(100, 200, 255, 0.8);
            color: #ffffff;
            background: rgba(100, 200, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(100, 200, 255, 0.25);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover::after {
            opacity: 1;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% {
                background-position: 0% 0%;
                box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
            }
            50% {
                background-position: 100% 100%;
                box-shadow: 0 0 25px rgba(100, 200, 255, 0.6);
            }
            100% {
                background-position: 0% 0%;
                box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
            }
        }

        .button-icon {
            font-size: 1.2rem;
        }

        .cta-button.primary {
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.2) 0%, rgba(100, 200, 255, 0.1) 100%);
            border-color: rgba(100, 200, 255, 0.6);
            color: #64c8ff;
        }

        .cta-button.primary:hover {
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.3) 0%, rgba(100, 200, 255, 0.2) 100%);
            border-color: rgba(100, 200, 255, 1);
            box-shadow: 0 15px 40px rgba(100, 200, 255, 0.35);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cta-section {
                padding: 40px 25px;
                margin: 40px auto;
            }

            .cta-title {
                font-size: 1.8rem;
            }

            .cta-description {
                font-size: 0.95rem;
            }

            .cta-buttons {
                gap: 15px;
            }

            .cta-button {
                padding: 12px 30px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <section class="cta-section">
        <div class="cta-content">
            <h2 class="cta-title">نیاز به مشاوره بیش از خرید داریم؟</h2>
            <p class="cta-description">
                تیم تخصصی ما آماده است تا تمام سوالات و نیازهای شما را پاسخ دهد.
                <br>
                در هر زمان با ما تماس بگیرید.
            </p>

            <div class="cta-buttons">
                <a href="https://wa.me/989XXXXXXXXX" class="cta-button primary">
                    <span class="button-icon">💬</span>
                    <span>پیام در واتس‌اپ</span>
                </a>
                <a href="tel:+989XXXXXXXXX" class="cta-button">
                    <span class="button-icon">📞</span>
                    <span>تماس تلفنی</span>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
